<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</head>
<body onload="load()">

    <div class="container-fluid">
        <div class="row" id="target">
            
        </div>
    </div>

    
    <div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">Recipe Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="modalBody">
                    
                </div>
            </div>
        </div>
    </div>

    <script>
        async function load() {
            var response = await fetch('recipe.json');  // Ensure the 'recipes.json' file is available

            var body = await response.json();

            var list = body.recipes; 

            var target = document.getElementById('target');

            for (var i = 0; i < list.length; i++) {
                var card = document.createElement('div');
                card.classList.add('col-lg-3', 'col-md-4', 'col-sm-10', 'col-xs-12');
                card.innerHTML = `
                    <div class="card m-3">
                        <div class="card-header">
                            <img src="${list[i].image}" width="300px" height="300px" alt="Recipe Image">
                        </div>
                        <div class="card-body">
                            <div><b>item name:</b> ${list[i].name}</div>
                            <div><b>Difficulty:</b> ${list[i].difficulty}</div>
                            <div><b>Rating:</b> ${list[i].rating}</div>
                            
                            <div><b>Cusine:</b> ${list[i].cusine}</div>
                            <button class="btn btn-primary mt-3" onclick="showDetails(${i})">View Details</button>
                        </div>
                    </div>
                `;
                target.appendChild(card);
            }
        }

        function showDetails(index) {
            
            var response = fetch('recipe.json'); 
            response.then(res => res.json()).then(body => {

                var list = body.recipes;

                var recipe = list[index];
                var modalBody = document.getElementById('modalBody');
                modalBody.innerHTML = `
                    <div><b>item name:</b> ${recipe.name}</div>
                    <div><b>Difficulty:</b> ${recipe.difficulty}</div>
                    <div><b>Rating:</b> ${recipe.rating}</div>
                    
                    <div><b>Cusine:</b> ${recipe.cusine}</div>
                    <div><b>Description:</b> ${recipe.description}</div>
                    <div><b>Ingredients:</b> ${recipe.ingredients.join(', ')}</div>
                    <div><b>Instructions:</b> ${recipe.instructions}</div>
                    <div><img src="${recipe.image}" width="300px" height="300px" alt="Recipe Image"></div>
                `;

               
                var myModal = new bootstrap.Modal(document.getElementById('detailModal'));
                myModal.show();
            });
        }
    </script>
</body>
</html>
